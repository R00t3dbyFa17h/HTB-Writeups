name: Rebuild SUMMARY

on:
  push:
    branches: [main]
    paths:
      - 'machines/**'
      - 'challenges/**'
      - 'sherlocks/**'
      - 'prolabs/**'
      - 'notes/**'
      - 'tools/gen_summary.py'

permissions:
  contents: write

jobs:
  summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regenerate SUMMARY.md
        run: python3 tools/gen_summary.py -t "K70n0s510 Writeups"

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain SUMMARY.md)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add SUMMARY.md
            git commit -m "chore: rebuild SUMMARY.md"
            git push
          fi
